<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px;background:#07080A;color:#EDEFF2;font-family:Geist,-apple-system,"Segoe UI",system-ui,sans-serif;overflow:hidden}
  .glow{position:absolute;inset:0;background:radial-gradient(55% 60% at 70% 40%,rgba(139,124,255,0.22),transparent 70%)}
  .wrap{position:relative;padding:88px 96px;display:flex;flex-direction:column;justify-content:space-between;height:100%;box-sizing:border-box}
  h1{font-size:84px;line-height:1.0;letter-spacing:-0.025em;font-weight:600;margin:0}
  p{font-size:28px;line-height:1.4;color:#9BA1A9;margin:24px 0 0;max-width:760px}
  .mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;letter-spacing:0.06em;text-transform:uppercase;color:#5D636B}
  .pill{display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,0.08);border-radius:999px;padding:10px 18px;background:#0E1013}
  .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,#7CF7FF,#8B7CFF,#FF7CE5);box-shadow:0 0 18px rgba(139,124,255,0.6)}
  .glyph{position:absolute;right:96px;top:88px;width:160px;height:160px;border:6px solid rgba(255,255,255,0.22);border-radius:48px}
  .glyph i{position:absolute;left:50%;top:56%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:linear-gradient(135deg,#7CF7FF,#8B7CFF,#FF7CE5);box-shadow:0 0 60px rgba(139,124,255,0.55)}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div><span class="pill"><span class="dot"></span><span class="mono" style="color:#9BA1A9">on device · apple · nano · llama</span></span></div>
  <div><h1>AI that lives<br>on the phone.</h1><p>Copy-paste React Native components for on-device AI. Free, private, offline, fast.</p></div>
  <div class="mono">npx ondai add command-bar</div>
</div>
<div class="glyph"><i></i></div>
</body></html>
