name: Release

# On main: opens (or updates) a "Version packages" pull request from the pending changesets. Merging it
# builds @ondai/core, @ondai/tokens and the CLI and publishes them with `pnpm publish` (provenance on).
# Needs the NPM_TOKEN secret (an npm automation token with publish rights to `ondai` and `@ondai/*`).
# Off until the repository variable NPM_PUBLISH is set to `true` (Settings → Secrets and variables → Actions → Variables).

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version packages
          commit: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
